<script src="../script.js"></script>
<script>
  // Live Data Fetcher for Product Page
  document.addEventListener('DOMContentLoaded', () => {
    const merchants = document.querySelectorAll('.merchant-card');
    merchants.forEach(async (card) => {
      const url = card.dataset.url;
      const priceEl = card.querySelector('.merchant-price');
      if (!url || !priceEl) return;
      try {
        const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
        const data = await res.json();
        const doc = new DOMParser().parseFromString(data.contents, 'text/html');
        // Broad selector for multiple storefronts
        const livePrice = doc.querySelector('.price, .product-price, [data-price], .a-price-whole, .regular-price'); 
        if (livePrice && livePrice.innerText) {
          priceEl.innerText = livePrice.innerText.trim().replace(/[^0-9.$৳]/g, '');
          priceEl.classList.add('text-emerald-400'); // Highlight live update
        }
      } catch (e) { console.log("Silent fail on live fetch"); }
    });
  });
</script>
