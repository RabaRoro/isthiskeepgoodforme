<!DOCTYPE html>
<html class="dark" lang="en"><head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta name="description" content="" id="meta-description">
  <title>lala  | The Geek Shop</title>
  <link rel="icon" type="image/x-icon" href="logo t.png"> 
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "primary-fixed-dim": "#dbb8ff", "on-primary": "#3f2160", "on-secondary-fixed": "#181a2b",
            "background": "#0c1322", "surface-container-lowest": "#070e1d", "surface-container": "#191f2f",
            "on-surface": "#dce2f7", "surface-variant": "#2e3545", "surface": "#0c1322",
            "on-primary-fixed": "#29074a", "surface-container-low": "#141b2b",
            "surface-container-highest": "#2e3545", "outline": "#968e9a", "on-surface-variant": "#cdc3d0",
            "primary-fixed": "#efdbff", "surface-container-high": "#232a3a", "primary": "#ecd7ff",
            "primary-container": "#d8b4fe", "outline-variant": "#4a454f"
          },
          "fontFamily": {
            "headline": ["Space Grotesk"], "display": ["Space Grotesk"], "body": ["Inter"]
          }
        }
      }
    }
  </script>
  <style>
    .kinetic-grid {
      background-image: linear-gradient(to right, rgba(236, 215, 255, 0.05) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(236, 215, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
  </style>
</head>

<body class="bg-surface font-body text-on-surface selection:bg-primary-container selection:text-on-primary-container">

  <header class="bg-[#0c1322]/60 backdrop-blur-xl sticky top-0 z-[60] border-b border-white/5">
    <div class="flex justify-between items-center px-8 py-4 w-full max-w-screen-2xl mx-auto font-['Space_Grotesk'] tracking-tight">
      <a href="index.html" class="text-2xl font-bold tracking-tighter text-transparent bg-clip-text bg-gradient-to-br from-purple-200 to-purple-400">
        The Geek Shop
      </a>
      <div class="hidden md:flex items-center relative w-96">
        <span class="material-symbols-outlined absolute left-3 text-slate-500 text-sm">search</span>
        <input type="text" id="global-search-input" placeholder="Search across store..." class="w-full bg-surface-container-lowest border border-white/5 rounded-xl pl-9 pr-4 py-2 text-sm text-on-surface focus:outline-none focus:border-primary/50 focus:ring-0 placeholder:text-outline-variant transition-all">
      </div>
      <nav class="hidden md:flex items-center space-x-8">
        <a class="text-slate-400 hover:text-purple-200 transition-colors" href="index.html">Products</a>
      </nav>
      <div class="flex items-center space-x-6 text-purple-300">
        <button id="cart-link" class="flex items-center space-x-1 hover:text-purple-200 transition-colors cursor-pointer p-2 bg-surface-container-low rounded-xl border border-white/5">
          <span class="material-symbols-outlined">shopping_cart</span>
          <span class="text-xs font-bold font-display bg-primary text-on-primary-fixed px-2 py-0.5 rounded-full" id="cart-count">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="relative kinetic-grid min-h-screen">
    <section id="product-section" class="max-w-screen-2xl mx-auto px-8 py-12 lg:py-20 grid grid-cols-1 lg:grid-cols-12 gap-16">
      <div class="lg:col-span-7 space-y-6">
        <div id="main-image-container" class="relative group aspect-square lg:aspect-[4/3] overflow-hidden rounded-xl border border-outline-variant/10">
          <img id="main-image" src="https://www.google.com/imgres?q=test&amp;imgurl=https%3A%2F%2Fcdn.shopz.com.bd%2F2021%2F10%2FTesting-product.jpg&amp;imgrefurl=https%3A%2F%2Fwww.shopz.com.bd%2Fproduct%2Ftest-product&amp;docid=UI0nDw_acHcJLM&amp;tbnid=9eq5SSvK9niQEM&amp;vet=12ahUKEwjgupvJ-LaWAxUHluEIHUXBOTYQnPAOegQIRBAA..i&amp;w=1024&amp;h=1024&amp;hcb=2&amp;ved=2ahUKEwjgupvJ-LaWAxUHluEIHUXBOTYQnPAOegQIRBAA" alt="" class="w-full h-full object-cover transform transition-transform duration-700">
        </div>
      </div>

      <div class="lg:col-span-5 flex flex-col justify-center space-y-8">
        <div class="space-y-4">
          <h1 id="product-name" class="text-4xl lg:text-6xl font-display font-bold tracking-tighter leading-none text-transparent bg-clip-text bg-gradient-to-r from-on-surface to-primary-fixed-dim">lala </h1>
          <div id="product-price" class="price text-primary text-3xl font-display font-light">120</div>
        </div>

        <div class="space-y-6">
          <p id="product-meta-desc" class="text-on-surface-variant text-lg leading-relaxed max-w-md">asdfasdf</p>
          <button id="buy-now-btn" class="w-full py-4 bg-gradient-to-r from-primary to-primary-container text-on-primary-fixed font-bold rounded-xl shadow-lg hover:brightness-110 transition-all">
            Add to Shopping Cart
          </button>
        </div>
      </div>
    </section>

    <section class="max-w-screen-2xl mx-auto px-8 py-24 border-t border-outline-variant/10">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-20">
        <div class="space-y-8">
          <h2 class="text-3xl font-display font-bold tracking-tight">Product Overview</h2>
          <div id="product-detailed-desc" class="space-y-6 text-on-surface-variant leading-loose font-light">sdfsdfasdfsd</div>
        </div>
      </div>
    </section>
  </main>

  <div id="cart-slider" class="fixed top-0 right-0 h-full w-full max-w-md bg-surface-container border-l border-white/5 shadow-2xl z-[80] transform translate-x-full transition-transform duration-300 flex flex-col p-6">
    <div class="flex justify-between items-center pb-6 border-b border-white/5 mb-4">
      <h2 class="font-2xl font-bold text-on-surface flex items-center gap-2">Shopping Cart</h2>
      <button id="close-cart" class="text-slate-400 hover:text-white text-3xl">×</button>
    </div>
    <div id="cart-items" class="flex-1 overflow-y-auto space-y-4"></div>
    <div class="pt-4 border-t border-white/5 space-y-4">
      <div class="flex justify-between text-lg">
        <span>Total:</span>
        <span id="cart-total" class="font-bold text-primary">৳0</span>
      </div>
      <button id="checkout-cart" class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary-fixed font-bold py-4 rounded-xl">Checkout</button>
    </div>
  </div>

  <script type="module" src="script.js"></script>

</body></html>
