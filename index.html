<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>The Geek Shop | Store</title>
  <link rel="icon" type="image/x-icon" href="logo t.png"> 
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "surface-bright": "#323949", "surface-container": "#191f2f", "surface-variant": "#2e3545",
            "surface-container-low": "#141b2b", "inverse-surface": "#dce2f7", "surface-container-highest": "#2e3545",
            "surface": "#0c1322", "surface-container-high": "#232a3a", "outline": "#968e9a",
            "background": "#0c1322", "outline-variant": "#4a454f", "surface-container-lowest": "#070e1d",
            "on-surface": "#dce2f7", "primary": "#ecd7ff", "on-background": "#dce2f7",
            "on-surface-variant": "#cdc3d0", "primary-fixed": "#efdbff", "on-primary": "#3f2160",
            "primary-container": "#d8b4fe", "on-primary-fixed": "#29074a"
          }
        }
      }
    }
  </script>
</head>

<body class="bg-background selection:bg-primary/30 min-h-screen flex flex-col font-['Inter']">

  <header class="bg-[#0c1322]/80 backdrop-blur-xl top-0 sticky z-[60] border-b border-white/5">
    <div class="flex justify-between items-center px-6 lg:px-8 py-4 w-full max-w-screen-2xl mx-auto">
      <a href="index.html" class="flex items-center gap-2 text-2xl font-bold tracking-tighter text-transparent bg-clip-text bg-gradient-to-br from-purple-200 to-purple-400 font-['Space_Grotesk']">
        <span>The Geek Shop</span>
      </a>
      
      <div class="hidden md:flex items-center relative w-96">
        <span class="material-symbols-outlined absolute left-3 text-slate-500 text-sm">search</span>
        <input type="text" id="global-search-input" placeholder="Search components globally..." class="w-full bg-surface-container-lowest border border-white/5 rounded-xl pl-9 pr-4 py-2 text-sm text-on-surface focus:outline-none focus:border-primary/50 focus:ring-0 placeholder:text-outline-variant transition-all">
      </div>

      <div class="flex items-center gap-6">
        <button id="cart-link" class="relative p-2 bg-surface-container-low rounded-xl border border-white/5 hover:bg-surface-variant transition-all">
          <span class="material-symbols-outlined text-slate-300 block">shopping_cart</span>
          <span id="cart-count" class="absolute -top-2 -right-2 bg-purple-500 text-white text-[10px] font-bold rounded-full h-5 w-5 flex items-center justify-center border border-[#0c1322]">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-screen-2xl w-full mx-auto px-6 lg:px-8 py-8 lg:py-12 grid grid-cols-1 lg:grid-cols-4 gap-8">
    <aside class="lg:col-span-1 h-fit lg:sticky lg:top-28">
      <div class="space-y-6 bg-surface-container-low border border-white/5 p-6 rounded-2xl">
        <div class="space-y-2">
          <label class="text-[10px] font-bold uppercase tracking-widest text-outline">Search Store</label>
          <input type="text" id="search-input" placeholder="Filter page..." class="w-full bg-surface-container-lowest border border-white/5 rounded-xl px-4 py-2 text-xs text-on-surface focus:border-primary/40 focus:ring-0">
        </div>

        <div class="space-y-2">
          <label class="text-[10px] font-bold uppercase tracking-widest text-outline">Sort By</label>
          <select id="sort-select" class="w-full bg-surface-container-lowest border border-white/5 rounded-xl px-3 py-2 text-xs text-on-surface focus:border-primary/40 focus:ring-0">
            <option value="latest">Latest Arrivals</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
          </select>
        </div>
      </div>
    </aside>

    <div class="lg:col-span-3">
      <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>
    </div>
  </main>

  <div id="cart-slider" class="fixed top-0 right-0 h-full w-full max-w-md bg-surface-container border-l border-white/5 shadow-2xl z-[80] transform translate-x-full transition-transform duration-300 flex flex-col p-6">
    <div class="flex justify-between items-center pb-6 border-b border-white/5 mb-4">
      <h2 class="font-2xl font-bold text-on-surface flex items-center gap-2">Shopping Cart</h2>
      <button id="close-cart" class="text-slate-400 hover:text-white text-3xl">&times;</button>
    </div>
    <div id="cart-items" class="flex-1 overflow-y-auto space-y-4"></div>
    <div class="pt-4 border-t border-white/5 space-y-4">
      <div class="flex justify-between text-lg">
        <span>Total:</span>
        <span id="cart-total" class="font-bold text-primary">৳0</span>
      </div>
      <button id="checkout-cart" class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary-fixed font-bold py-4 rounded-xl">Checkout</button>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
