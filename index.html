<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>The Geek Shop | Kinetic Laboratory</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "surface-bright": "#323949", "surface-container": "#191f2f", "surface-variant": "#2e3545",
            "surface-container-low": "#141b2b", "inverse-surface": "#dce2f7", "surface-container-highest": "#2e3545",
            "surface": "#0c1322", "surface-container-high": "#232a3a", "outline": "#968e9a",
            "background": "#0c1322", "outline-variant": "#4a454f", "surface-container-lowest": "#070e1d",
            "on-surface": "#dce2f7", "primary": "#ecd7ff", "on-background": "#dce2f7",
            "on-surface-variant": "#cdc3d0", "primary-fixed": "#efdbff", "on-primary": "#3f2160",
            "primary-container": "#d8b4fe", "on-primary-fixed": "#29074a"
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
    body { font-family: 'Inter', sans-serif; background-color: #0c1322; color: #dce2f7; }
    h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; }
  </style>
</head>
<body class="bg-background selection:bg-primary/30 min-h-screen flex flex-col">

  <header class="bg-[#0c1322]/80 backdrop-blur-xl top-0 sticky z-50 border-b border-white/5">
    <div class="flex justify-between items-center px-8 py-4 w-full max-w-screen-2xl mx-auto">
      <div class="text-2xl font-bold tracking-tighter text-transparent bg-clip-text bg-gradient-to-br from-purple-200 to-purple-400 font-['Space_Grotesk']">
        The Geek Shop
      </div>
      <div class="hidden md:flex items-center relative w-96">
        <span class="material-symbols-outlined absolute left-3 text-slate-500 text-sm">search</span>
        <input type="text" id="global-search-input" placeholder="Search catalog..." class="w-full bg-surface-container-lowest border border-white/5 rounded-xl pl-9 pr-4 py-2 text-sm text-on-surface focus:outline-none focus:border-primary/50">
      </div>
    </div>
  </header>

  <main class="max-w-screen-2xl mx-auto px-8 py-12 flex-1 w-full">
    <div class="flex flex-col md:flex-row gap-12">
      <!-- Sidebar Filters -->
      <aside class="w-full md:w-64 flex-shrink-0 space-y-10">
        <div>
          <h2 class="text-xs font-bold uppercase tracking-[0.2em] text-primary mb-6">Laboratory Filters</h2>
          <div class="relative mb-6">
            <input id="search-input" class="w-full bg-surface-container-lowest border-b-2 border-surface-container-highest px-0 py-3 text-sm focus:border-primary focus:ring-0 transition-all placeholder:text-outline-variant" placeholder="Search components..." type="text"/>
            <span class="material-symbols-outlined absolute right-0 top-3 text-outline-variant">search</span>
          </div>
          <div class="space-y-4">
            <label class="text-[10px] uppercase tracking-widest text-outline block">Sort Order</label>
            <select id="sort-select" class="w-full bg-surface-container-lowest border border-white/10 rounded-xl px-3 py-2 text-xs text-on-surface">
              <option value="latest">Latest Arrivals</option>
              <option value="price-low">Price: Low to High</option>
              <option value="price-high">Price: High to Low</option>
            </select>
          </div>
        </div>
      </aside>

      <!-- Main Content Area -->
      <div class="flex-1 space-y-8">
        <header class="flex flex-col md:flex-row md:items-end justify-between gap-6">
          <div>
            <span class="text-primary font-bold tracking-[0.2em] uppercase text-xs">Catalog.V2</span>
            <h1 class="text-5xl font-extrabold tracking-tighter mt-2 bg-clip-text text-transparent bg-gradient-to-r from-on-surface to-on-surface-variant">The Inventory</h1>
          </div>
        </header>

        <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
      </div>
    </div>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
