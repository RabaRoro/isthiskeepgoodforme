<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Loading Keeb...</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0c1322; color: #dce2f7; }
    h1, h2, h3, .font-display { font-family: 'Space Grotesk', sans-serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="bg-[#0c1322]/80 backdrop-blur-xl top-0 sticky z-50 border-b border-white/5 p-4">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <a href="../index.html" class="text-xl font-bold text-purple-400 font-display">The Geek Shop</a>
      <a href="../index.html" class="text-sm text-slate-400 hover:text-white">← Back to Guides</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-12 w-full flex-1 space-y-12">
    <!-- Header Section -->
    <div class="space-y-6 text-center">
      <h1 id="post-title" class="text-4xl md:text-5xl font-display font-bold text-white"></h1>
      <p class="text-slate-400 text-sm">Reviewed by <span id="post-author" class="text-purple-300 font-bold"></span></p>
      <img id="post-image" src="" class="w-full max-h-[500px] object-cover rounded-2xl border border-white/10 shadow-2xl">
    </div>

    <!-- Quick Stats & Scores -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="md:col-span-2 bg-slate-900 border border-white/5 rounded-xl p-6">
        <h3 class="text-lg font-bold mb-4 font-display text-purple-300">The Verdict</h3>
        <p id="post-verdict" class="text-slate-300 leading-relaxed"></p>
      </div>
      <div class="bg-slate-900 border border-white/5 rounded-xl p-6 flex flex-col justify-center items-center text-center">
        <div class="text-5xl font-display font-bold text-emerald-400 mb-2" id="post-avg-score"></div>
        <div class="text-xs text-slate-500 uppercase tracking-widest">Overall Score</div>
        <div id="post-scores-list" class="w-full mt-4 space-y-2 text-sm text-left"></div>
      </div>
    </div>

    <!-- Merchants / Where to buy -->
    <div>
      <h3 class="text-2xl font-bold mb-4 font-display">Where to Buy</h3>
      <div id="post-merchants" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <!-- Pros and Cons -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <div class="bg-emerald-950/20 border border-emerald-900/30 rounded-xl p-6">
        <h3 class="text-xl font-bold mb-4 text-emerald-400 flex items-center gap-2">Pros</h3>
        <ul id="post-pros" class="space-y-2 text-slate-300 list-disc list-inside"></ul>
      </div>
      <div class="bg-rose-950/20 border border-rose-900/30 rounded-xl p-6">
        <h3 class="text-xl font-bold mb-4 text-rose-400 flex items-center gap-2">Cons</h3>
        <ul id="post-cons" class="space-y-2 text-slate-300 list-disc list-inside"></ul>
      </div>
    </div>

    <!-- Overview -->
    <div class="prose prose-invert max-w-none">
      <h3 class="text-2xl font-bold font-display text-white">Detailed Overview</h3>
      <div id="post-overview" class="text-slate-300 leading-loose"></div>
    </div>

    <!-- Specs -->
    <div>
      <h3 class="text-2xl font-bold mb-4 font-display">Specifications</h3>
      <div class="bg-slate-900 rounded-xl border border-white/5 overflow-hidden">
        <table class="w-full text-sm text-left text-slate-300">
          <tbody id="post-specs" class="divide-y divide-white/5"></tbody>
        </table>
      </div>
    </div>
  </main>
  
  <!-- Merchant Live Data Script -->
  <script>
    // This attempts to fetch live prices from the provided URLs via a CORS proxy.
    // It looks for elements with specific data attributes injected by the admin panel.
    document.addEventListener('DOMContentLoaded', () => {
      const merchants = document.querySelectorAll('.merchant-card');
      merchants.forEach(async (card) => {
        const url = card.dataset.url;
        const priceEl = card.querySelector('.merchant-price');
        if (!url || !priceEl) return;

        try {
          // Using AllOrigins proxy to bypass CORS
          const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
          const data = await res.json();
          const html = data.contents;
          
          // WARNING: You must update this regex or use DOM parsing based on your specific merchants' HTML structure.
          // This is a generic example looking for an element with class "price"
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');
          const livePrice = doc.querySelector('.price, .product-price, [data-price]'); 
          
          if (livePrice && livePrice.innerText) {
            priceEl.innerText = livePrice.innerText.trim();
            priceEl.classList.add('text-emerald-400'); // Highlight that it's live
          }
        } catch (e) {
          console.log("Could not fetch live data for", url);
        }
      });
    });
  </script>
</body>
</html>
